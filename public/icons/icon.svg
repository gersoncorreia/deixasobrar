<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="120" y1="360" x2="380" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="256" y1="180" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#10b981" stroke-opacity="0.25" stroke-width="8" />
  
  <!-- Outer Glow circle -->
  <circle cx="256" cy="256" r="160" fill="#10b981" fill-opacity="0.12" filter="blur(30px)" />
  
  <!-- Geometric Wallet / Vault / Ascending Arc -->
  <path d="M140 290 C140 210, 210 150, 290 150 C360 150, 400 200, 400 250" stroke="url(#emeraldGrad)" stroke-width="32" stroke-linecap="round" />
  
  <!-- Ascending arrow / surplus trend -->
  <path d="M160 350 L256 254 L320 318 L390 190" stroke="url(#emeraldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M320 190 H390 V260" stroke="url(#emeraldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing Coin / Teto Diário icon -->
  <circle cx="210" cy="230" r="32" fill="url(#glowGrad)" />
  <circle cx="210" cy="230" r="24" stroke="#ffffff" stroke-width="4" stroke-opacity="0.7" />
  <text x="210" y="238" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#064e3b" text-anchor="middle">R$</text>
</svg>
